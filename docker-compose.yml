services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm-council-backend
    expose:
      - "5000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATA_DIR=/app/data/conversations
    volumes:
      - ./data/conversations:/app/data/conversations
    restart: always
    networks:
      - llm-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: llm-council-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge
